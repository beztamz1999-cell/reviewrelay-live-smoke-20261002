name: ChaosCards catalog one-off
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: github.event.head_commit.message == 'Add one-off ChaosCards export'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: scratch/chaoscards-pokemon-3020-20261014
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright requests pillow
      - run: python -m playwright install --with-deps chromium
      - run: python chaoscards-pokemon/export_data.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-products
          path: dataset/
          retention-days: 2
